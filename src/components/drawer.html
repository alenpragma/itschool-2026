<!-- ==========================================================================
     components/drawer.html — mobile navigation panel (shared by every page)
     --------------------------------------------------------------------------
     A right-anchored, full-height slide-in panel plus a dimmed/blurred scrim.
     Opened by #burger, closed by #drawerClose, the scrim, Escape, or a nav
     link. Focus is trapped while open and restored on close (main.js §2).

     Tokens filled by build.js (all sourced from data/site.json):
       DRAWER_LINKS        one .drawer-link per nav entry, index in --i so the
                           entrance animation can stagger
       DRAWER_CTA_LABEL / DRAWER_CTA_EYEBROW / DRAWER_CTA_HREF
       DRAWER_PHONE / DRAWER_PHONE_HREF
       DRAWER_EMAIL / DRAWER_EMAIL_HREF
       DRAWER_ADDRESS
       DRAWER_SOCIAL       social icon links
     ========================================================================== -->
<div class="drawer-scrim" id="drawerScrim" aria-hidden="true"></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true"
       aria-label="Site menu" aria-hidden="true">
  <div class="drawer-top">
    <!-- Drawer panel is navy like the footer, so it takes the light variant. -->
    <a href="index.html" class="brand">
      <img class="brand-logo" src="assets/images/logo-full-light.png"
           alt="Edulife IT School — Education for Life"
           width="300" height="100" decoding="async" />
    </a>
    <button class="drawer-close" id="drawerClose" type="button" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <nav class="drawer-nav" aria-label="Mobile navigation">
    {{DRAWER_LINKS}}
  </nav>

  <a class="drawer-cta" href="{{DRAWER_CTA_HREF}}">
    <span class="dc-txt">
      <small>{{DRAWER_CTA_EYEBROW}}</small>
      <b>{{DRAWER_CTA_LABEL}}</b>
    </span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>

  <div class="drawer-foot">
    <div class="drawer-contact">
      <a class="dc-row" href="{{DRAWER_PHONE_HREF}}">
        <span class="dc-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg></span>
        <span class="dc-text"><small>Call the office</small><b>{{DRAWER_PHONE}}</b></span>
      </a>
      <a class="dc-row" href="{{DRAWER_EMAIL_HREF}}">
        <span class="dc-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
        <span class="dc-text"><small>Email us</small><b>{{DRAWER_EMAIL}}</b></span>
      </a>
      <div class="dc-row dc-static">
        <span class="dc-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
        <span class="dc-text"><small>Visit a campus</small><b>{{DRAWER_ADDRESS}}</b></span>
      </div>
    </div>
    <div class="drawer-social">{{DRAWER_SOCIAL}}</div>
  </div>
</aside>
