# =============================================================================
# Netlify configuration — Edulife IT School
# https://docs.netlify.com/build/configure-builds/file-based-configuration/
#
# The site is a plain multi-page STATIC build. `node scripts/build.js` assembles
# the whole publishable site into dist/ from src/ + public/, and dist/ is what
# gets served. There is no framework and nothing here is framework-specific.
# =============================================================================

[build]
  # Publish the generated output directory. The built pages, the blog/ notice/
  # event/ detail folders, assets/ and data/ all live inside dist/ and are
  # served as-is. (dist/data/*.json must stay reachable — the runtime
  # data-loader fetches it when a page is switched to live mode.)
  publish = "dist"

  # Rebuild from source on every deploy, so a commit that only touches
  # src/data/*.json, src/pages/*.html or src/assets/css refreshes the published
  # HTML. The build writes dist/ directly (and cleans it first), so there is no
  # copy step and no stale file can survive.
  command = "node scripts/build.js"

[build.environment]
  # build.js uses only Node built-ins (fs, path, crypto) — there is no
  # npm install and no bundler step.
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# Caching & security headers
# -----------------------------------------------------------------------------
# Netlify applies the MOST SPECIFIC matching rule, so the /assets/* rules below
# win over the catch-all for those paths.
#
# HTML and JSON must stay revalidated so a redeploy is visible immediately.
# Every local CSS/JS URL additionally carries a content-hash query
# (`?v=xxxxxxxx`, generated by build.js from the asset bytes), so a long
# immutable cache is safe for the assets themselves — the URL changes whenever
# the code does.

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# -----------------------------------------------------------------------------
# Clean detail routes + 404 fallback
# -----------------------------------------------------------------------------
# Every blog post / notice / event is built as a REAL file at
# blog/<slug>.html (notice/<slug>.html, event/<slug>.html), so those canonical
# URLs already work with no configuration at all.
#
# The rules below add the EXTENSIONLESS variants (/blog/<slug>) on top of them.
# A redirect with force = false only applies when no file exists at the
# requested path, so a request for /blog/<slug>.html is served straight from
# disk and these rules are skipped — that is what stops an already-correct URL
# from being rewritten to /blog/<slug>.html.html.
#
# ORDER MATTERS: rules are evaluated top-down and the first match wins, so the
# specific routes must come before the catch-all 404 at the bottom.

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat.html"
  status = 200
  force = false

[[redirects]]
  from = "/notice/*"
  to = "/notice/:splat.html"
  status = 200
  force = false

[[redirects]]
  from = "/event/*"
  to = "/event/:splat.html"
  status = 200
  force = false

# The runtime detail route. article.html reads ?type=<blog|notice|event>&slug=<slug>
# and renders client-side through the same shared renderers, so
# /article.html?type=blog&slug=why-questions-are-the-beginning-of-learning
# already resolves with no rewrite (a query string is never part of a path).
# This rule only adds the extensionless /article form.
[[redirects]]
  from = "/article"
  to = "/article.html"
  status = 200
  force = false

# 404 fallback. Netlify will already serve a 404.html from the publish root for
# unmatched paths; stating it explicitly keeps the intent obvious and preserves
# a real 404 status (rather than a soft-200 SPA fallback).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false
