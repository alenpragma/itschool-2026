name: Build & deploy to GitHub Pages

# Rebuilds the site from source and publishes the generated dist/ directory to
# GitHub Pages.
# Enable once under: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Assemble the whole publishable site into dist/ (the build cleans dist/
      # first, so no stale page can survive a rename or removal).
      - name: Build the site
        run: node scripts/build.js

      # Fail the deploy if the quality gate does not pass.
      - name: Quality gate
        run: node scripts/check.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
